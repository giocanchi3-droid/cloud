name: Pipeline CI-CD Stock

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

env:
  BACKEND_IMAGE: giocanchi/stock-zapatos-backend
  FRONTEND_IMAGE: giocanchi/stock-zapatos-frontend

jobs:
  validar:
    name: Validar proyecto
    runs-on: ubuntu-latest

    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v6

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Instalar dependencias del backend
        working-directory: backend
        run: npm install

      - name: Validar sintaxis del backend
        run: |
          find backend/src -type f -name "*.js" -print0 |
          xargs -0 -n1 node --check

      - name: Instalar dependencias del frontend
        working-directory: frontend
        run: npm install

      - name: Compilar frontend
        working-directory: frontend
        run: npm run build

  publicar:
    name: Publicar imágenes Docker
    needs: validar
    runs-on: ubuntu-latest

    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v6

      - name: Configurar Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Iniciar sesión en Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Construir y publicar backend
        uses: docker/build-push-action@v7
        with:
          context: ./backend
          file: ./backend/Dockerfile
          push: true
          tags: |
            ${{ env.BACKEND_IMAGE }}:1.0
            ${{ env.BACKEND_IMAGE }}:latest
            ${{ env.BACKEND_IMAGE }}:${{ github.sha }}
          cache-from: type=gha,scope=backend
          cache-to: type=gha,mode=max,scope=backend

      - name: Construir y publicar frontend
        uses: docker/build-push-action@v7
        with:
          context: ./frontend
          file: ./frontend/Dockerfile
          push: true
          tags: |
            ${{ env.FRONTEND_IMAGE }}:1.0
            ${{ env.FRONTEND_IMAGE }}:latest
            ${{ env.FRONTEND_IMAGE }}:${{ github.sha }}
          cache-from: type=gha,scope=frontend
          cache-to: type=gha,mode=max,scope=frontend

  desplegar:
    name: Desplegar en AWS EC2
    needs: publicar
    runs-on: ubuntu-latest

    steps:
      - name: Preparar conexión SSH
        env:
          EC2_SSH_KEY: ${{ secrets.EC2_SSH_KEY }}
          EC2_HOST: ${{ secrets.EC2_HOST }}
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "$EC2_SSH_KEY" > ~/.ssh/github_actions
          chmod 600 ~/.ssh/github_actions
          ssh-keyscan -H "$EC2_HOST" >> ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts

      - name: Actualizar aplicación en EC2
        env:
          EC2_HOST: ${{ secrets.EC2_HOST }}
          EC2_USER: ${{ secrets.EC2_USER }}
        run: |
          ssh \
            -o IdentitiesOnly=yes \
            -i ~/.ssh/github_actions \
            "$EC2_USER@$EC2_HOST" \
            'bash -s' <<'REMOTE_SCRIPT'

          set -e

          cd /home/ubuntu/cloud

          git fetch origin
          git reset --hard origin/main

          sudo docker compose \
            --env-file .env \
            -f docker-compose.prod.yml \
            pull backend frontend

          sudo docker compose \
            --env-file .env \
            -f docker-compose.prod.yml \
            up -d

          sleep 20

          sudo docker compose \
            --env-file .env \
            -f docker-compose.prod.yml \
            ps

          curl \
            --fail \
            --retry 12 \
            --retry-delay 5 \
            --retry-connrefused \
            http://127.0.0.1/api/health

          sudo docker image prune -f

          REMOTE_SCRIPT