services:
  database:
    image: postgres:17-alpine
    container_name: stock-zapatos-db
    restart: unless-stopped

    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}

    volumes:
      - stock_zapatos_data:/var/lib/postgresql/data
      - ./database/init.sql:/docker-entrypoint-initdb.d/01-init.sql:ro

    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"
        ]

      interval: 5s
      timeout: 5s
      retries: 20

    networks:
      - stock-network

  backend:
    image: ${DOCKERHUB_USERNAME}/stock-zapatos-backend:${APP_VERSION:-1.0}

    container_name: stock-zapatos-backend
    restart: unless-stopped

    environment:
      NODE_ENV: production
      PORT: 8080
      DB_HOST: database
      DB_PORT: 5432
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      CORS_ORIGIN: ${CORS_ORIGIN:-*}

    depends_on:
      database:
        condition: service_healthy

    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:8080/api/health').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"
        ]

      interval: 10s
      timeout: 5s
      retries: 10

    networks:
      - stock-network

  frontend:
    image: ${DOCKERHUB_USERNAME}/stock-zapatos-frontend:${APP_VERSION:-1.0}

    container_name: stock-zapatos-frontend
    restart: unless-stopped

    ports:
      - "80:80"

    depends_on:
      backend:
        condition: service_healthy

    networks:
      - stock-network

volumes:
  stock_zapatos_data:

networks:
  stock-network:
    driver: bridge